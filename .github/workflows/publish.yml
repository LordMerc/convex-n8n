# Publishes this package only after a protected version tag is pushed.
#
# This is the steady-state workflow used after the package exists on npm. npm
# Trusted Publishing cannot be configured for an unpublished package, so follow
# the README's one-time bootstrap instructions first. Then configure npm with
# the GitHub origin's owner and repository, this workflow name (publish.yml),
# and the npm-publish environment. Protect that GitHub environment with required
# reviewers. This job uses GitHub OIDC; do not retain NPM_TOKEN or any other
# long-lived npm credential or secret.
#
# The starter-supported `npm run release` command detects GitHub Actions, runs
# lint and build, and calls npm publish with provenance enabled.
name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

# Two tags pushed close together must not publish concurrently; never cancel a
# publish that is already in flight.
concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment:
      name: npm-publish
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
          registry-url: 'https://registry.npmjs.org/'
      # The npm bundled with Node 22.x is 10.x, which has no OIDC token exchange.
      # Trusted Publishing needs npm >= 11.5.1; without this the publish fails at
      # auth because no NPM_TOKEN is (or should be) present.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm test
      # ONE-TIME v0.1.0 bootstrap. Remove this token binding immediately after
      # the package exists on npm and before enabling Trusted Publishing.
      - name: Release with npm provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm run release
