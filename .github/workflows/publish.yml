# Publishes this package only after a protected version tag is pushed.
#
# Steady-state tokenless publishing: npm Trusted Publishing is configured for
# this package (repo LordMerc/convex-n8n, workflow publish.yml, environment
# npm-publish, protected by required reviewers). The job exchanges its GitHub
# OIDC token with npm; do not add NPM_TOKEN or any other long-lived npm
# credential or secret.
#
# The starter-supported `npm run release` command detects GitHub Actions, runs
# lint and build, and calls npm publish with provenance enabled.
name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

# Two tags pushed close together must not publish concurrently; never cancel a
# publish that is already in flight.
concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment:
      name: npm-publish
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
          registry-url: 'https://registry.npmjs.org/'
      # Install with the npm version bundled with Node 22 so package-lock.json is
      # interpreted exactly as it is in CI. Upgrade only for the publish step.
      - run: npm ci
      # Trusted Publishing needs npm >= 11.5.1 for its OIDC token exchange.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@^11.5.1
      - run: npm test
      - name: Release with npm provenance
        run: npm run release
